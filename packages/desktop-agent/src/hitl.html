<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onefend — Action Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111827;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header-icon {
            padding: 7px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 15px;
            font-weight: 600;
        }

        .message {
            color: #9ca3af;
            line-height: 1.45;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .message strong {
            color: #e5e7eb;
        }

        .preview {
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            max-height: 120px;
            overflow-y: auto;
            overflow-x: hidden;
            margin-bottom: 12px;
        }

        .preview-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .preview-text {
            font-family: monospace;
            font-size: 12px;
            color: #ef4444;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .buttons {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: auto;
            flex-shrink: 0;
            padding-top: 12px;
        }

        .btn {
            height: 34px;
            padding: 0 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.15s;
            border: none;
            white-space: nowrap;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-clear {
            background: transparent;
            border: 1px solid #374151;
            color: #9ca3af;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #374151;
            color: #e5e7eb;
        }

        .btn-primary {
            font-weight: 600;
            color: white;
            border: none;
        }

        .btn.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #374151;
            border-top-color: #6b7280;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="container" id="content">
        <div class="loading" id="loading">
            <span class="spinner"></span> Loading...
        </div>
    </div>
    <script type="module" src="./hitl.js"></script>
</body>

</html>
