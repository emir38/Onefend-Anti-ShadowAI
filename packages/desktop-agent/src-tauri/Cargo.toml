[package]
name = "onefend-desktop-agent"
version = "0.1.0"
description = "Onefend Desktop Agent"
authors = ["Onefend Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }

tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.31"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
futures = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# ── HTTPS Proxy (Claude Code CLI interception) ──────────────────────────────
# TLS certificate generation (CA + per-domain leaf certs, on-the-fly)
rcgen = "0.13"
# Async TLS: rustls runtime + tokio adapter
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
# Load OS native CA certificates (for outgoing TLS to real servers)
rustls-native-certs = "0.8"
# Lazy statics (CA cert singleton, proxy state)
once_cell = "1"
regex = "1"
tauri-plugin-single-instance = "2.4.0"





[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
