<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Blocked — Onefend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #FAF7FF;
            color: #1E1B39;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid rgba(212, 200, 255, 0.5);
            max-width: 640px;
            width: 100%;
            padding: 56px 52px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #E22D54 0%, #6466FF 100%);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 32px;
        }

        .logo-label {
            font-size: 13px;
            font-weight: 500;
            color: #A5AEB7;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 700;
            color: #1E1B39;
            letter-spacing: -0.3px;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .icon-ring {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(226, 45, 84, 0.08);
            border: 1.5px solid rgba(226, 45, 84, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: pulse-ring 2.5s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(226, 45, 84, 0.18); }
            50%       { box-shadow: 0 0 0 12px rgba(226, 45, 84, 0); }
        }

        .header-text h1 {
            font-size: 30px;
            font-weight: 800;
            color: #1E1B39;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin: 0 0 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #E22D54;
            background: rgba(226, 45, 84, 0.1);
            border-radius: 999px;
            padding: 3px 10px;
        }

        .badge-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #E22D54;
        }

        .policy-block {
            background: #FAF7FF;
            border: 1px solid rgba(212, 200, 255, 0.5);
            border-left: 3px solid #E22D54;
            padding: 16px 20px;
        }

        .policy-label {
            font-size: 11px;
            font-weight: 700;
            color: #E22D54;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .policy-text {
            font-size: 15px;
            color: #A5AEB7;
            font-weight: 500;
            line-height: 1.6;
        }

        .policy-text strong {
            color: #1E1B39;
        }

        .ai-card {
            border: 1px solid rgba(37, 198, 136, 0.3);
            border-left: 3px solid #25C688;
            background: rgba(37, 198, 136, 0.04);
            padding: 16px 20px;
            margin-top: 16px;
            display: none;
        }

        .ai-card.visible { display: block; }

        .ai-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #25C688;
            margin-bottom: 5px;
        }

        .ai-name {
            font-size: 14px;
            font-weight: 700;
            color: #1E1B39;
            margin-bottom: 3px;
        }

        .ai-url {
            font-size: 12px;
            color: #6466FF;
            text-decoration: none;
            font-weight: 500;
            word-break: break-all;
        }

        .ai-url:hover { text-decoration: underline; }

        .divider {
            height: 1px;
            background: rgba(212, 200, 255, 0.5);
            margin: 24px 0;
        }

        .footer-text {
            font-size: 13px;
            color: #A5AEB7;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Protected by Onefend — top right -->
        <div class="logo-wrap">
            <span class="logo-label">Protected by</span>
            <svg width="16" height="16" viewBox="0 0 32 54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.7395 31.2277V54H31.8877V18.2621L7.99512 29.4534V38.3914L23.7395 31.2277Z" fill="#6466FF"/>
                <path d="M31.8877 0L0 14.1414V23.3076L31.8877 9.16438V0Z" fill="#6466FF"/>
            </svg>
            <span class="logo-text">Onefend</span>
        </div>

        <!-- Icon + Title + Badge row -->
        <div class="header-row">
            <div class="icon-ring">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E22D54" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </div>
            <div class="header-text">
                <h1>Access Blocked</h1>
                <span class="badge">
                    <span class="badge-dot"></span>
                    Policy Enforced
                </span>
            </div>
        </div>

        <!-- Policy reason -->
        <div class="policy-block">
            <div class="policy-label">Policy Enforcement</div>
            <div class="policy-text"><strong id="domain-name">This application</strong> is restricted by your organization's AI governance policy. All access attempts are logged and reported.</div>
        </div>

        <!-- Approved AI card (hidden until populated) -->
        <div id="approved-ai-card" class="ai-card">
            <div class="ai-label">✦ Your organization's approved AI</div>
            <div id="approved-ai-name" class="ai-name"></div>
            <a id="approved-ai-url" class="ai-url" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Footer -->
        <span class="footer-text">Contact your IT administrator if this is an error.</span>
    </div>

    <script src="blocked.js"></script>
</body>

</html>
