services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: onefend
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/onefend
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-secret}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      SERVER_URL: ${SERVER_URL:-http://localhost}
      CORS_ORIGIN: ${SERVER_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_CLIENT_EMAIL: ${GCP_CLIENT_EMAIL:-}
      GCP_PRIVATE_KEY: ${GCP_PRIVATE_KEY:-}
      GCP_DOCAI_PROCESSOR_ID: ${GCP_DOCAI_PROCESSOR_ID:-}
      GCP_MODEL: ${GCP_MODEL:-}
      GCP_LOCATION: ${GCP_LOCATION:-}

  migrate:
    build:
      context: ./packages/backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/onefend
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@onefend.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    command: >
      sh -c "npx prisma migrate deploy && node seed-simple.js"
    restart: "no"

  frontend:
    build:
      context: ./packages/frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      PORT: "8080"
      BACKEND_INTERNAL_URL: http://backend:3000/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
